name: Firebase Storage Rules Tests

on:
  pull_request:
    paths:
      - "storage.rules"
      - "firestore.rules"
      - "firebase.json"
      - "package.json"
      - "package-lock.json"
      - "test/storage.rules.test.mjs"
      - ".github/workflows/storage-rules-tests.yml"
  push:
    branches: [main]
    paths:
      - "storage.rules"
      - "firestore.rules"
      - "firebase.json"
      - "package.json"
      - "package-lock.json"
      - "test/storage.rules.test.mjs"
      - ".github/workflows/storage-rules-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: storage-rules-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  storage-rules:
    name: Firebase Storage Security Rules Emulator Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Set up Java for Firebase Emulators
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run Storage Rules tests with required emulators
        run: npx firebase emulators:exec --only firestore,storage --project demo-dojo-storage-tests "node --test test/storage.rules.test.mjs"
