name: Test Firestore Security Rules

on:
  pull_request:
    paths:
      - "firestore.rules"
      - "firebase.json"
      - "package.json"
      - "test/**"
      - ".github/workflows/**"
  push:
    branches:
      - main
    paths:
      - "firestore.rules"
      - "firebase.json"
      - "package.json"
      - "test/**"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  workflow-lint:
    name: Validate GitHub Actions workflow YAML
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Lint all workflow files
        uses: reviewdog/action-actionlint@v1
        with:
          reporter: github-check
          fail_level: error

  emulator-tests:
    name: Firestore Rules Emulator Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install test dependencies
        run: npm install --no-audit --no-fund
      - name: Run Firestore Emulator tests
        run: npx firebase emulators:exec --only firestore --project demo-dojo-rules-tests "npm test"
