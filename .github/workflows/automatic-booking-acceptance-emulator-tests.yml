name: Automatic Booking Emulator Acceptance (Reference Model)

on:
  pull_request:
    paths:
      - "functions/test/automatic_booking_acceptance_emulator.test.cjs"
      - ".github/workflows/automatic-booking-acceptance-emulator-tests.yml"
      - "functions/package.json"
      - "firebase.json"

permissions:
  contents: read

concurrency:
  group: automatic-booking-acceptance-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  automatic-booking-reference-model:
    name: Synthetic Firestore Emulator contract reference tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PR revision
        uses: actions/checkout@v5
      - name: Set up Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install root Firebase CLI dependencies
        run: npm install --no-package-lock --no-audit --no-fund
      - name: Install Functions dependencies
        working-directory: functions
        run: npm install --no-package-lock --no-audit --no-fund
      - name: Build Functions
        working-directory: functions
        run: npm run build
      - name: Run synthetic Automatic Booking reference-model tests
        env:
          GCLOUD_PROJECT: demo-dojo-automatic-booking
        run: |
          npx firebase emulators:exec --only firestore --project demo-dojo-automatic-booking "node --test --test-concurrency=1 functions/test/automatic_booking_acceptance_emulator.test.cjs"
