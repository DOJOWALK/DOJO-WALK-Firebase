name: Cancellation and Refund Policy Synthetic Emulator Tests

on:
  pull_request:
    paths:
      - "functions/test/cancellation_refund_policy_emulator.test.cjs"
      - ".github/workflows/cancellation-refund-policy-emulator-tests.yml"
      - "functions/package.json"
      - "package.json"
      - "firebase.json"

permissions:
  contents: read

concurrency:
  group: cancellation-refund-policy-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  cancellation-refund-policy:
    name: Synthetic Cancellation and Refund Policy Firestore Emulator tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PR revision
        uses: actions/checkout@v5
      - name: Set up Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install Firebase CLI dependencies
        run: npm install --no-package-lock --no-audit --no-fund
      - name: Install Functions dependencies
        run: npm --prefix functions install --no-package-lock --no-audit --no-fund
      - name: Run synthetic Cancellation and Refund Policy Emulator tests
        env:
          GCLOUD_PROJECT: demo-dojo-cancellation-refund
        run: |
          npx firebase emulators:exec --only firestore --project demo-dojo-cancellation-refund "node --test --test-concurrency=1 functions/test/cancellation_refund_policy_emulator.test.cjs"
