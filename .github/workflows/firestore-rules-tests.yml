name: Firestore Rules Tests

on:
  push:
    branches: [main]
    paths:
      - "firestore.rules"
      - "firestore.indexes.json"
      - "firebase.json"
      - "package.json"
      - "package-lock.json"
      - "test/**"
      - ".github/workflows/firestore-rules-tests.yml"
  pull_request:
    paths:
      - "firestore.rules"
      - "firestore.indexes.json"
      - "firebase.json"
      - "package.json"
      - "package-lock.json"
      - "test/**"
      - ".github/workflows/firestore-rules-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firestore-rules-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  firestore-rules:
    name: Firestore Security Rules Emulator Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java for Firebase Emulator
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run Firestore Rules tests in emulator
        run: npx firebase emulators:exec --only firestore --project demo-dojo-walker-lifecycle-rules "npm test"
