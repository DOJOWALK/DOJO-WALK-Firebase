name: Manual Deploy Trusted Boundary Review Function

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type DEPLOY_REVIEW_FUNCTION to authorize deploying this callable"
        required: true
        type: string
      target_project:
        description: "Must match the intended Firebase project ID"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: trusted-boundary-function-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Test and deploy only reviewServiceLocationBoundary
    if: ${{ github.ref == 'refs/heads/main' && inputs.confirmation == 'DEPLOY_REVIEW_FUNCTION' && inputs.target_project == 'dojo-platform-b68a3' }}
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 25
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Java for Firestore Emulator
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install function dependencies
        working-directory: functions
        run: npm ci --no-audit --no-fund

      - name: Build and run Functions tests with Firestore Emulator
        working-directory: functions
        run: npx --yes firebase-tools emulators:exec --only firestore --project demo-dojo-rules-tests "npm test"

      - name: Authenticate Firebase
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "Missing FIREBASE_SERVICE_ACCOUNT secret"
            exit 1
          fi
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/firebase-service-account.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/firebase-service-account.json" >> "$GITHUB_ENV"

      - name: Deploy only reviewServiceLocationBoundary
        run: npx --yes firebase-tools deploy --only functions:reviewServiceLocationBoundary --project dojo-platform-b68a3 --non-interactive

      - name: Post-deploy reminder
        run: |
          echo "Function deployment command completed."
          echo "Verify the deployed callable, region asia-south1, logs, and authorized/unauthorized behavior before deploying Firestore Rules."
          echo "This workflow does not deploy Firestore Rules or activate/import any locations."
