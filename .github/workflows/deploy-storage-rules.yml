name: Manual Deploy Firebase Storage Rules

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type DEPLOY_STORAGE_RULES to authorize deploying Storage Rules"
        required: true
        type: string
      target_project:
        description: "Must match the intended Firebase project ID"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: firebase-storage-rules-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Test and deploy Storage Rules only
    if: ${{ github.ref == 'refs/heads/main' && inputs.confirmation == 'DEPLOY_STORAGE_RULES' && inputs.target_project == 'dojo-platform-b68a3' }}
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 25
    steps:
      - name: Checkout main
        uses: actions/checkout@v5
        with:
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Set up Java for Firebase Emulators
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run Storage Rules Emulator tests
        run: npx firebase emulators:exec --only firestore,storage --project demo-dojo-storage-tests "node --test test/storage.rules.test.mjs"

      - name: Authenticate Firebase
        env:
          FIREBASE_RULES_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_RULES_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$FIREBASE_RULES_SERVICE_ACCOUNT" ]; then
            echo "Missing FIREBASE_RULES_SERVICE_ACCOUNT secret"
            exit 1
          fi

          printf '%s' "$FIREBASE_RULES_SERVICE_ACCOUNT" > "$RUNNER_TEMP/firebase-service-account.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/firebase-service-account.json" >> "$GITHUB_ENV"

      - name: Deploy Storage Rules only
        run: npx --yes firebase-tools deploy --only storage --project dojo-platform-b68a3 --non-interactive

      - name: Post-deploy reminder
        run: |
          echo "Storage Rules deployment command completed."
          echo "Verify walker selfie and KYC upload/read flows after deployment."
          echo "This workflow does not deploy Firestore Rules, Functions, or application releases."
